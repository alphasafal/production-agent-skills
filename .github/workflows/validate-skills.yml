name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Brackets the range declared in pyproject.toml (requires-python = ">=3.9").
        # setup-python has no 3.9 build for the newest runner image, so the
        # oldest supported version runs on the last image that has one.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    name: validate (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run unit tests (structure, frontmatter, references, eval cases)
        run: pytest tests/ -v

      - name: Run static skill validation
        run: python scripts/validate_skills.py -v

      - name: Run static evaluation checks
        run: python scripts/run_static_evals.py

      - name: Plugin marketplace is in sync with packs.json
        run: python scripts/build_marketplace.py --check

      - name: Install index and prompt cheatsheet are in sync with their sources
        run: python scripts/build_catalog.py --check

      - name: Release archives build and pass their own upload-rule checks
        run: python scripts/package_skills.py --out "$RUNNER_TEMP/dist"

      - name: Run routing evals (catalog-wide, deterministic)
        run: python scripts/run_routing_evals.py

      - name: Behavioral eval runner plans cleanly (no model calls)
        run: python scripts/run_behavioral_evals.py --dry-run

      # Validates against the reference implementation of the open spec, which
      # enforces a stricter YAML subset than PyYAML accepts. Kept as a separate,
      # network-dependent step so a registry/network outage is distinguishable
      # from an actual skill defect.
      - name: Install the official skills-ref validator
        id: skills_ref
        continue-on-error: true
        run: |
          pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref --version

      - name: Validate every skill against the open spec (skills-ref)
        if: steps.skills_ref.outcome == 'success'
        run: |
          set -e
          for dir in skills/*/; do
            echo "::group::$dir"
            skills-ref validate "$dir"
            echo "::endgroup::"
          done

      # Codex caps the initial skill list at ~8,000 chars. Every description edit
      # spends this budget, so it's enforced rather than just documented.
      - name: Every role pack fits the 8,000-byte discovery budget
        if: steps.skills_ref.outcome == 'success'
        run: |
          set -e
          FAIL=0
          for pack in $(python -c "import json;print(' '.join(json.load(open('packs.json'))['packs']))"); do
            DIRS=$(python -c "import json,sys;print(' '.join('skills/'+s for s in json.load(open('packs.json'))['packs'][sys.argv[1]]['skills']))" "$pack")
            SIZE=$(skills-ref to-prompt $DIRS | wc -c)
            echo "pack $pack: $SIZE bytes (limit 8000)"
            [ "$SIZE" -le 8000 ] || { echo "::error::pack $pack discovery prompt is $SIZE bytes, over 8,000"; FAIL=1; }
          done
          echo "all skills together: $(skills-ref to-prompt skills/*/ | wc -c) bytes (Claude Code: fine; Codex: install by pack)"
          exit $FAIL

      - name: Report skills-ref unavailable
        if: steps.skills_ref.outcome != 'success'
        run: |
          echo "::warning::skills-ref could not be installed (network/registry issue) — \
          spec validation was skipped. scripts/validate_skills.py still enforces the \
          same strict-YAML rules locally."

  # install.sh is what most people run first, on whatever machine they have, so
  # it is exercised with both GNU (Linux) and BSD (macOS) userlands and with a
  # real download, not only through the unit tests above.
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: install.sh (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Install a pack into an empty project, update it, remove it
        run: |
          set -e
          SCRIPT="$PWD/install.sh"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          sh "$SCRIPT" --pack sre
          for s in incident-responder deploy-pipeline-reviewer debugging-investigator; do
            test -f ".agents/skills/$s/SKILL.md"
          done
          diff -r "$GITHUB_WORKSPACE/skills/incident-responder" .agents/skills/incident-responder
          sh "$SCRIPT" --pack sre | grep -q "skip"
          sh "$SCRIPT" --pack sre --force | grep -q "Installed 3, skipped 0"
          sh "$SCRIPT" --pack sre --uninstall
          test -z "$(ls -A .agents/skills)"

      - name: Claude Code projects are detected, --global goes to the home directory
        run: |
          set -e
          SCRIPT="$PWD/install.sh"
          mkdir -p "$RUNNER_TEMP/claude-project/.claude" && cd "$RUNNER_TEMP/claude-project"
          sh "$SCRIPT" --skill repo-architect
          test -f .claude/skills/repo-architect/SKILL.md
          HOME="$RUNNER_TEMP/fake home" sh "$SCRIPT" --all --agent cursor --global
          test "$(ls "$RUNNER_TEMP/fake home/.agents/skills" | wc -l | tr -d " ")" = "$(ls "$GITHUB_WORKSPACE/skills" | wc -l | tr -d " ")"

      # The path a new user takes: piped from stdin, nothing on disk, downloading
      # this exact commit. Skipped on pull requests, whose merge commit may not be
      # downloadable.
      - name: Piped install downloads and installs this commit
        if: github.event_name == 'push'
        run: |
          set -e
          cp install.sh "$RUNNER_TEMP/piped.sh"
          mkdir "$RUNNER_TEMP/piped" && cd "$RUNNER_TEMP/piped"
          sh -s -- --pack security --ref "$GITHUB_SHA" < "$RUNNER_TEMP/piped.sh"
          diff -r "$GITHUB_WORKSPACE/skills/threat-modeler" .agents/skills/threat-modeler

  # The bundled data-scientist scripts are the only executable skill content in
  # the repo, so they get exercised against a real fixture rather than only
  # being checked for syntax by the structural tests above.
  skill-scripts:
    runs-on: ubuntu-latest
    name: data-scientist scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data-scientist dependencies
        run: pip install -e '.[data-scientist]'

      - name: Every script exposes --help
        run: |
          set -e
          for f in skills/data-scientist/scripts/*.py; do
            echo "::group::$f --help"
            python "$f" --help > /dev/null
            echo "::endgroup::"
          done

      - name: Run scripts against the repo's own fixture
        run: |
          set -e
          F=evaluations/fixtures/churn_sample.csv
          python skills/data-scientist/scripts/profile_dataset.py "$F"
          python skills/data-scientist/scripts/check_missingness.py "$F"
          python skills/data-scientist/scripts/detect_duplicates.py "$F" --key customer_id
          python skills/data-scientist/scripts/check_leakage.py "$F" --target churned
          python skills/data-scientist/scripts/generate_summary.py "$F" --target churned --key customer_id

      - name: Leakage screen must flag the fixture's known leaky column
        run: |
          python skills/data-scientist/scripts/check_leakage.py \
            evaluations/fixtures/churn_sample.csv --target churned \
            | grep -q "cancellation_reason" \
            || { echo "check_leakage failed to flag the known leakage column"; exit 1; }

      - name: Scripts fail with a readable message when dependencies are absent
        run: |
          python -m venv /tmp/nodeps
          OUT=$(/tmp/nodeps/bin/python skills/data-scientist/scripts/profile_dataset.py \
            evaluations/fixtures/churn_sample.csv 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "pip install pandas numpy" \
            || { echo "expected a friendly dependency message, got a raw traceback"; exit 1; }
