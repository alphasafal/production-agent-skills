[project]
name = "production-agent-skills"
version = "0.2.1"
description = "Reusable Agent Skills for engineering, data, and product workflows"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
]

[project.optional-dependencies]
data-scientist = [
  "pandas>=1.5",
  "numpy>=1.23",
]
dev = [
  "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# This repo is a collection of scripts invoked directly (`python scripts/x.py`),
# not an importable library — disable package discovery so `pip install -e .`
# only resolves dependencies instead of failing on the multiple top-level
# directories (skills/, docs/, evaluations/, ...) that aren't Python packages.
[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
